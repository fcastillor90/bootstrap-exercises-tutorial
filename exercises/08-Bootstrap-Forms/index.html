<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
			crossorigin="anonymous"
		/>
		<title>08 Bootstrap Forms</title>
	</head>
	<body>
		<div class="col-3 mx-auto my-5">
			<!-- Add your code below this line -->
			<form class="bg-secondary justify-content-center rounded">
				<div class="mb-8 justify-content-center">
					<h2>Please login</h2>
				</div>
				<div class="form-control bg-secondary">
					<input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Email Address" />
				</div>
				<div class="form-control bg-secondary">
					<input type="password" class="form-control" id="exampleFormControlInput2" placeholder="Password" />
				</div>
				<div class="row mb-4">
					<div class="col d-flex justify-content-left margin-3">
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="form2Example31" checked />
							<label class="form-check-label" for="form2Example31"> Remember me </label>
						</div>
					</div>
				</div>
				<div>
					<button type="button" class="btn btn-primary w-100">Login</button>
				</div>
			</form>
		</div>
	</body>
</html>
